<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Տիգրան և Լուսինե | Հարսանիքի հրավիրատոմս</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:wght@300;400;600&family=Noto+Sans+Armenian:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--champagne:#f7e7ce;--ivory:#fffff0;--blush:#f4c2c2;--navy:#1a1a2e;
--glass:rgba(255,255,255,0.1);--glass-border:rgba(255,255,255,0.2);--rose:#d97b93}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cormorant Garamond','Noto Sans Armenian',serif;background:var(--ivory);
color:var(--navy);overflow-x:hidden;line-height:1.6}
#particles-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9998}
.lang-switcher{position:fixed;top:30px;right:30px;z-index:9999;display:flex;gap:10px;
background:rgba(255,255,255,0.15);backdrop-filter:blur(20px);padding:12px 25px;border-radius:50px;
border:1px solid var(--glass-border);box-shadow:0 8px 32px rgba(0,0,0,0.1)}
.lang-btn{background:transparent;border:none;font-family:'Playfair Display',serif;font-size:14px;
cursor:pointer;color:var(--navy);opacity:.6;transition:all .3s ease;padding:5px 12px;border-radius:20px}
.lang-btn.active,.lang-btn:hover{opacity:1;background:var(--gold);color:white;transform:translateY(-2px)}
.music-player{position:fixed;bottom:30px;right:30px;z-index:9999;background:rgba(255,255,255,0.15);
backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:50px;padding:15px 25px;
display:flex;align-items:center;gap:15px;box-shadow:0 8px 32px rgba(0,0,0,0.15);cursor:pointer;transition:all .3s ease}
.music-player:hover{transform:translateY(-5px) scale(1.05);box-shadow:0 12px 40px rgba(212,175,55,0.3)}
.music-icon{width:45px;height:45px;background:var(--gold);border-radius:50%;display:flex;
align-items:center;justify-content:center;animation:pulse 2s infinite}
.music-icon.playing{animation:rotate 3s linear infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,0.4)}50%{box-shadow:0 0 0 15px rgba(212,175,55,0)}}
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.music-text{font-family:'Playfair Display',serif;font-size:14px;color:var(--navy)}
/* --- ԲԱՑՄԱՆ ԷԿՐԱՆ · ՍՐՏԻԿՈՎ --- */
#heart-overlay{position:fixed;inset:0;background:#f7f2ea;display:flex;justify-content:center;
align-items:center;z-index:10000;transition:opacity 1s ease,visibility 1s ease;cursor:pointer;overflow:hidden}
#heart-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
#heartImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
transition:transform 1.5s ease,opacity 1.3s}
#heart-overlay.open #heartImg{transform:scale(1.3);opacity:0}
#heart-overlay::after{content:'';position:absolute;left:0;right:0;bottom:0;height:16%;
background:linear-gradient(transparent,#f7f2ea);pointer-events:none}
.sc-petal{position:absolute;left:50%;top:45%;width:20px;height:15px;
background:linear-gradient(135deg,#f9dde4,#ea9db1);border-radius:70% 30% 60% 40%;
transition:transform 1.35s cubic-bezier(.2,.7,.3,1),opacity 1.25s;pointer-events:none;z-index:3}
.click-hint{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);color:var(--rose);
font-family:'Playfair Display','Noto Sans Armenian',serif;font-size:20px;letter-spacing:3px;
animation:pulse-text 2s ease-in-out infinite;white-space:nowrap;z-index:2}
@keyframes pulse-text{0%,100%{opacity:.6}50%{opacity:1}}
/* --- ՆԿԱՐ ԸՆՏՐԵԼՒ ԿՃԱԿ --- */
.img-pick{position:absolute;top:16px;left:16px;z-index:6;width:46px;height:46px;border-radius:50%;
border:1px solid rgba(212,175,55,.6);background:rgba(255,255,255,.8);backdrop-filter:blur(6px);
cursor:pointer;font-size:20px;transition:.3s;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.img-pick:hover{transform:scale(1.12)}
#website-content{opacity:0;visibility:hidden;transition:opacity 1.5s ease}
#website-content.visible{opacity:1;visibility:visible}
.hero{height:100vh;width:100%;position:relative;background-color:#23233f;
background:linear-gradient(rgba(26,26,46,0.4),rgba(26,26,46,0.4)),url('777.jpg') center/cover fixed;
display:flex;align-items:center;justify-content:center;text-align:center;color:white;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
background:radial-gradient(circle,rgba(212,175,55,0.1) 0%,transparent 70%);animation:rotate 20s linear infinite}
.hero-content{position:relative;z-index:2;padding:60px;max-width:1000px;background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);border:2px solid rgba(255,255,255,0.2);border-radius:30px;
box-shadow:0 25px 80px rgba(0,0,0,0.3);animation:fadeInUp 1.5s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
.hero-subtitle{font-family:'Playfair Display','Noto Sans Armenian',serif;font-size:clamp(1.2rem,4vw,1.8rem);
letter-spacing:10px;text-transform:uppercase;margin-bottom:30px;color:var(--champagne);text-shadow:2px 2px 4px rgba(0,0,0,0.5)}
.hero-names{font-family:'Playfair Display','Noto Sans Armenian',serif;font-size:clamp(3rem,10vw,6rem);
font-weight:300;letter-spacing:8px;margin-bottom:20px;text-shadow:3px 3px 6px rgba(0,0,0,0.5)}
.hero-ampersand{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(2.5rem,8vw,4rem);
color:var(--gold);margin:20px 0;animation:float-amp 3s ease-in-out infinite}
@keyframes float-amp{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)}}
.hero-date{font-size:clamp(1.3rem,4vw,2rem);font-weight:300;letter-spacing:5px;color:var(--gold);
margin-bottom:40px;text-shadow:2px 2px 4px rgba(0,0,0,0.5)}
.countdown{display:flex;justify-content:center;gap:25px;margin-top:40px;flex-wrap:wrap}
.countdown-item{background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border:2px solid rgba(212,175,55,0.3);
border-radius:20px;padding:20px 30px;min-width:100px;transition:all .3s ease}
.countdown-item:hover{transform:translateY(-10px);background:rgba(212,175,55,0.2);box-shadow:0 15px 40px rgba(212,175,55,0.3)}
.countdown-number{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3rem);color:var(--gold);display:block;font-weight:700}
.countdown-label{font-size:.9rem;color:var(--champagne);text-transform:uppercase;letter-spacing:3px;margin-top:5px;display:block}
.section{padding:120px 20px;max-width:1200px;margin:0 auto}
.section-title{font-family:'Playfair Display','Noto Sans Armenian',serif;font-size:clamp(2.5rem,6vw,4rem);
text-align:center;color:var(--navy);margin-bottom:60px;position:relative}
.section-title::before,.section-title::after{content:'✦';position:absolute;top:50%;transform:translateY(-50%);
color:var(--gold);font-size:1.5rem}
.section-title::before{left:-50px}.section-title::after{right:-50px}
.ceremony-section{position:relative;background-color:#fffff0;
background:linear-gradient(rgba(255,255,240,0.95),rgba(255,255,240,0.95)),url('12121.jpg') center/cover fixed;overflow:hidden}
.ceremony-section::before{content:'';position:absolute;inset:0;
background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="1" fill="%23d4af37" opacity="0.3"/></svg>');
background-size:50px 50px;opacity:.5}
.timeline{position:relative;max-width:900px;margin:0 auto;padding:40px 0}
.timeline::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:4px;
background:linear-gradient(to bottom,transparent,var(--gold),var(--champagne),var(--gold),transparent);
transform:translateX(-50%);border-radius:2px}
.timeline-item{position:relative;margin-bottom:80px;display:flex;align-items:center;opacity:0;
transform:translateY(30px);transition:all .8s ease}
.timeline-item.visible{opacity:1;transform:translateY(0)}
.timeline-item:nth-child(even){flex-direction:row-reverse}
.timeline-content{width:45%;background:white;padding:40px;border-radius:25px;box-shadow:0 15px 50px rgba(0,0,0,0.1);
border:2px solid rgba(212,175,55,0.2);transition:all .3s ease;position:relative}
.timeline-content::before{content:'';position:absolute;top:50%;width:0;height:0;border:15px solid transparent}
.timeline-item:nth-child(odd) .timeline-content::before{left:100%;border-left-color:white;transform:translateY(-50%)}
.timeline-item:nth-child(even) .timeline-content::before{right:100%;border-right-color:white;transform:translateY(-50%)}
.timeline-content:hover{transform:translateY(-10px) scale(1.02);box-shadow:0 20px 60px rgba(212,175,55,0.2)}
.timeline-dot{position:absolute;left:50%;transform:translateX(-50%);width:70px;height:70px;
background:linear-gradient(135deg,var(--gold),var(--champagne));border-radius:50%;display:flex;
align-items:center;justify-content:center;font-size:32px;box-shadow:0 8px 30px rgba(212,175,55,0.5);
z-index:2;border:4px solid white;transition:all .3s ease}
.timeline-item:hover .timeline-dot{transform:translateX(-50%) scale(1.2) rotate(360deg)}
.timeline-time{font-family:'Playfair Display',serif;font-size:2rem;color:var(--gold);margin-bottom:10px;font-weight:700}
.timeline-title{font-family:'Playfair Display','Noto Sans Armenian',serif;font-size:1.5rem;color:var(--navy);margin-bottom:8px;font-weight:600}
.timeline-location{color:#666;font-size:1.1rem;font-style:italic}
.gallery-section{position:relative;background-color:#fffff0;
background:linear-gradient(rgba(255,255,240,0.9),rgba(255,255,240,0.9)),url('444.jpg') center/cover fixed;padding:120px 20px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;max-width:1200px;margin:0 auto}
.gallery-item{position:relative;overflow:hidden;border-radius:20px;aspect-ratio:3/4;cursor:pointer;
box-shadow:0 15px 50px rgba(0,0,0,0.2);transition:all .4s ease;border:3px solid var(--gold);background-color:#e9ddc8}
.gallery-item:hover{transform:translateY(-15px) scale(1.03);box-shadow:0 25px 70px rgba(212,175,55,0.4)}
.gallery-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(212,175,55,0.8),transparent);
opacity:0;transition:opacity .4s ease;display:flex;align-items:flex-end;padding:30px}
.gallery-item:hover .gallery-overlay{opacity:1}
.gallery-text{color:white;font-family:'Playfair Display','Noto Sans Armenian',serif;font-size:1.5rem;
transform:translateY(20px);transition:transform .4s ease}
.gallery-item:hover .gallery-text{transform:translateY(0)}
.rsvp-section{position:relative;background-color:#23233f;
background:linear-gradient(rgba(26,26,46,0.8),rgba(26,26,46,0.8)),url('888.jpg') center/cover fixed;color:white;padding:120px 20px}
.rsvp-section::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(212,175,55,0.1) 0%,transparent 70%)}
.rsvp-form{max-width:650px;margin:0 auto;background:rgba(255,255,255,0.1);backdrop-filter:blur(30px);
border:2px solid rgba(255,255,255,0.2);border-radius:40px;padding:60px;position:relative;z-index:2;box-shadow:0 25px 80px rgba(0,0,0,0.3)}
.form-group{margin-bottom:30px}
.form-group label{display:block;margin-bottom:10px;font-family:'Playfair Display','Noto Sans Armenian',serif;
font-size:1.2rem;color:var(--champagne);letter-spacing:1px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:18px 25px;
background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3);border-radius:15px;color:white;
font-family:'Cormorant Garamond','Noto Sans Armenian',serif;font-size:1.1rem;transition:all .3s ease}
.form-group select option{color:var(--navy);background:white}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;
border-color:var(--gold);background:rgba(255,255,255,0.2);box-shadow:0 5px 20px rgba(212,175,55,0.2)}
.form-group textarea{resize:vertical;min-height:120px}
.submit-btn{width:100%;padding:22px;background:linear-gradient(135deg,var(--gold),var(--champagne));
border:none;border-radius:15px;font-family:'Playfair Display','Noto Sans Armenian',serif;font-size:1.3rem;
color:var(--navy);cursor:pointer;transition:all .3s ease;letter-spacing:3px;text-transform:uppercase;
font-weight:600;box-shadow:0 10px 30px rgba(212,175,55,0.3)}
.submit-btn:hover{transform:translateY(-5px);box-shadow:0 15px 40px rgba(212,175,55,0.5)}
.thank-you{position:relative;background-color:#23233f;
background:linear-gradient(rgba(26,26,46,0.7),rgba(26,26,46,0.7)),url('church.jpg') center/cover fixed;
color:white;text-align:center;padding:150px 20px}
.thank-you-content{max-width:800px;margin:0 auto;background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);
padding:60px;border-radius:30px;border:2px solid rgba(255,255,255,0.2)}
.hearts{font-size:4rem;animation:heartbeat 1.5s ease-in-out infinite;margin-bottom:30px}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.thank-you h2{font-family:'Playfair Display','Noto Sans Armenian',serif;font-size:clamp(2.5rem,6vw,4rem);
margin-bottom:30px;color:var(--gold);text-shadow:2px 2px 4px rgba(0,0,0,0.5)}
.thank-you p{font-size:clamp(1.1rem,3vw,1.4rem);line-height:2;margin-bottom:40px;font-style:italic;color:var(--champagne)}
.couple-names-final{font-family:'Playfair Display','Noto Sans Armenian',serif;font-size:clamp(2rem,5vw,3rem);margin-top:30px;color:var(--gold)}
.fade-in{opacity:0;transform:translateY(40px);transition:all .8s ease}
.fade-in.visible{opacity:1;transform:translateY(0)}
@media (max-width:768px){
.lang-switcher{top:15px;right:15px;padding:8px 15px}
.music-player{bottom:20px;right:20px;padding:12px 20px}
.timeline::before{left:35px}
.timeline-item,.timeline-item:nth-child(even){flex-direction:row;padding-left:90px}
.timeline-content{width:100%}
.timeline-content::before{display:none}
.timeline-dot{left:35px}
.hero-content{padding:40px 25px;margin:0 15px}
.rsvp-form{padding:40px 25px}
.countdown{gap:15px}
.countdown-item{min-width:80px;padding:15px 20px}
.gallery-grid{grid-template-columns:1fr}
}
</style>
</head>

<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Տիգրան և Լուսինե | Հարսանիքի հրավիրատոմս</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@400;600;700;900&family=Noto+Sans+Armenian:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#fbf7f0;--pink:#f4c6d0;--pink-deep:#e8a3b0;--rose:#d97b93;--gold:#b98a2f;--ink:#5a4636}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans Armenian',sans-serif;background:var(--cream);color:var(--ink)}
.gold{background:linear-gradient(45deg,#a67c2e,#e3c06a,#8f6a25,#d9b45c);-webkit-background-clip:text;background-clip:text;color:transparent}
h1,h2,h3{font-family:'Noto Serif Armenian',serif}
.btn{font-family:'Noto Sans Armenian',sans-serif;border:none;cursor:pointer;border-radius:999px;
padding:10px 22px;font-size:.95rem;background:linear-gradient(135deg,var(--pink),var(--pink-deep));
color:#6b3244;box-shadow:0 4px 14px rgba(217,123,147,.35);transition:.25s}
.btn:hover{transform:translateY(-2px)}
.btn.gold-btn{background:linear-gradient(135deg,#e3c06a,#b98a2f);color:#fff8ea}
/* --- ԲԱԺԻ 1 · ԲԱՑՄԱՆ ԷԿՐԱՆ (նկարով) --- */
#overlay{position:fixed;inset:0;z-index:100;background:#f7f2ea;cursor:pointer;overflow:hidden;transition:opacity 1s}
#overlay.hidden{opacity:0;pointer-events:none}
#heartImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.5s ease,opacity 1.3s}
#overlay.open #heartImg{transform:scale(1.3);opacity:0}
#overlay::after{content:'';position:absolute;left:0;right:0;bottom:0;height:16%;
background:linear-gradient(transparent,#f7f2ea);pointer-events:none}
.tap-hint{position:absolute;bottom:76px;width:100%;text-align:center;font-family:'Noto Serif Armenian',serif;
color:var(--rose);letter-spacing:1px;animation:pulse 2s infinite}
.ov-names{position:absolute;bottom:30px;width:100%;text-align:center;font-family:'Noto Serif Armenian',serif;
letter-spacing:2px;font-size:1.2rem}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.sc-petal{position:absolute;left:50%;top:45%;width:20px;height:15px;
background:linear-gradient(135deg,#f9dde4,#ea9db1);border-radius:70% 30% 60% 40%;
transition:transform 1.35s cubic-bezier(.2,.7,.3,1),opacity 1.25s;pointer-events:none}
.petal{position:absolute;top:-40px;animation:fall linear infinite;user-select:none;pointer-events:none}
@keyframes fall{0%{transform:translateY(-8vh) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translateY(112vh) rotate(340deg);opacity:.7}}
#main{display:none}
body.opened #main{display:block;animation:fadeUp 1s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
section{padding:64px 18px;max-width:880px;margin:0 auto;text-align:center}
.reveal{opacity:0;transform:translateY(26px);transition:all .9s ease}
.reveal.visible{opacity:1;transform:none}
.hero{position:relative;min-height:94vh;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:16px;max-width:none;overflow:hidden;
background:var(--cream);background-size:cover;background-position:center}
.cn{position:absolute;width:180px;height:180px;pointer-events:none;opacity:.95;
background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><g opacity='.95'><path d='M20 20 q60 20 90 70' stroke='%238aa87a' stroke-width='4' fill='none'/><path d='M20 20 q20 60 70 90' stroke='%238aa87a' stroke-width='4' fill='none'/><ellipse cx='70' cy='40' rx='16' ry='7' fill='%239db98a' transform='rotate(25 70 40)'/><ellipse cx='45' cy='70' rx='16' ry='7' fill='%239db98a' transform='rotate(65 45 70)'/><ellipse cx='100' cy='80' rx='14' ry='6' fill='%23a9c497' transform='rotate(40 100 80)'/><circle cx='55' cy='55' r='30' fill='%23f6cdd6'/><circle cx='55' cy='55' r='21' fill='%23f2b9c7'/><circle cx='55' cy='55' r='12' fill='%23ea9db1'/><circle cx='55' cy='55' r='5' fill='%23d97b93'/><circle cx='115' cy='45' r='22' fill='%23f9dde4'/><circle cx='115' cy='45' r='14' fill='%23f2b9c7'/><circle cx='115' cy='45' r='7' fill='%23ea9db1'/><circle cx='45' cy='115' r='20' fill='%23f9dde4'/><circle cx='45' cy='115' r='13' fill='%23f2b9c7'/><circle cx='45' cy='115' r='6' fill='%23ea9db1'/><circle cx='95' cy='95' r='12' fill='%23f6cdd6'/><circle cx='95' cy='95' r='6' fill='%23ea9db1'/></g></svg>") no-repeat;background-size:contain}
.cn.tl{top:-4px;left:-4px}.cn.tr{top:-4px;right:-4px;transform:scaleX(-1)}
.cn.bl{bottom:-4px;left:-4px;transform:scaleY(-1)}.cn.br{bottom:-4px;right:-4px;transform:scale(-1)}
.skyline{position:absolute;left:50%;top:7%;transform:translateX(-50%);width:min(90%,700px);height:240px;
pointer-events:none;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 300'><g opacity='.8'><ellipse cx='450' cy='288' rx='440' ry='36' fill='%23e9d9c9'/><ellipse cx='120' cy='272' rx='210' ry='46' fill='%23dfe8d5'/><ellipse cx='790' cy='276' rx='220' ry='50' fill='%23e3ecd8'/><rect x='320' y='150' width='260' height='125' fill='%23f3e2d3' stroke='%23d9bfa8' stroke-width='3'/><path d='M350 150 q100 -140 200 0 z' fill='%23c96f5b'/><path d='M350 150 q100 -140 200 0' fill='none' stroke='%23a85543' stroke-width='4'/><rect x='443' y='52' width='14' height='34' fill='%23c96f5b'/><circle cx='450' cy='48' r='6' fill='%23d9b45c'/><rect x='245' y='115' width='44' height='160' fill='%23eadbc8'/><path d='M245 115 l22 -48 l22 48 z' fill='%23c98a6b'/><rect x='612' y='135' width='38' height='140' fill='%23eadbc8'/><path d='M612 135 l19 -38 l19 38 z' fill='%23c98a6b'/><rect x='380' y='190' width='26' height='40' fill='%23d9bfa8'/><rect x='494' y='190' width='26' height='40' fill='%23d9bfa8'/></g></svg>") center/contain no-repeat}
.names{font-size:clamp(2.2rem,8vw,4rem);font-weight:900;font-style:italic;margin-top:180px;
text-shadow:0 2px 0 #fff,0 6px 18px rgba(185,138,47,.3)}
.invite-line{font-size:clamp(1rem,3.6vw,1.25rem);color:#7a5c43;letter-spacing:.5px}
.date-line{font-family:'Noto Serif Armenian',serif;color:var(--rose);font-size:1.1rem}
.ch-bg{position:absolute;bottom:18px;right:18px}
.paper{background:#fffaf3;border:1px solid #eadbc8;border-radius:22px;padding:42px 26px;
box-shadow:0 10px 30px rgba(90,70,54,.08);position:relative}
.paper::before,.paper::after{content:'🌸';position:absolute;font-size:30px;opacity:.7}
.paper::before{top:-14px;left:-8px}.paper::after{bottom:-14px;right:-8px}
.paper h2{font-size:1.7rem;margin-bottom:16px}
.paper p{line-height:2.1;font-size:1.05rem;color:#6b5442}
.cal-wrap{position:relative;display:inline-block;padding:26px}
.cal-wrap::before,.cal-wrap::after{content:'🌷🌸';position:absolute;font-size:34px;letter-spacing:-6px}
.cal-wrap::before{top:-6px;left:-30px}.cal-wrap::after{bottom:-6px;right:-30px}
.cal-card{background:#fffaf3;border:2px solid #d9b45c;border-radius:18px;padding:26px 22px;
box-shadow:0 10px 26px rgba(185,138,47,.15)}
.cal-card h3{font-size:1.4rem;margin-bottom:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,40px);gap:6px;justify-content:center}
.dow{font-weight:600;color:var(--rose);font-size:.8rem;padding:4px 0}
.day{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:.95rem;color:#6b5442}
.day.marked{background:linear-gradient(135deg,var(--pink),var(--rose));color:#fff;font-weight:700;
box-shadow:0 4px 12px rgba(217,123,147,.5);position:relative}
.day.marked::after{content:'♥';position:absolute;top:-13px;font-size:12px;color:var(--rose)}
.cd-title{margin:36px 0 16px;font-size:1.15rem;color:#7a5c43}
.countdown{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cd-box{background:#fffaf3;border:1.5px solid #d9b45c;border-radius:14px;min-width:80px;padding:14px 8px;
box-shadow:0 6px 16px rgba(185,138,47,.12)}
.cd-box b{display:block;font-size:1.9rem;color:#8f6a25;font-family:'Noto Serif Armenian',serif}
.cd-box span{font-size:.8rem;color:#a08468}
.events{display:flex;flex-direction:column;gap:24px;max-width:600px;margin:28px auto 0}
.event{position:relative;border-radius:20px;overflow:hidden;min-height:170px;display:flex;
flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:26px 16px;
box-shadow:0 10px 24px rgba(90,70,54,.16)}
.event .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.event .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,250,248,.18),rgba(255,240,244,.5))}
.bg-home{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 500'><rect width='900' height='500' fill='%23f3cfd6'/><rect x='70' y='90' width='170' height='250' fill='%23fbe9ec' stroke='%23e7b9c2' stroke-width='6'/><rect x='660' y='90' width='170' height='250' fill='%23fbe9ec' stroke='%23e7b9c2' stroke-width='6'/><rect x='350' y='110' width='200' height='320' rx='10' fill='%23fff6ef' stroke='%23e2c8ac' stroke-width='8'/><path d='M365 430 v-270 q85 -75 170 0 v270 z' fill='%238a5a3b'/><path d='M450 165 v265' stroke='%236f452c' stroke-width='6'/><circle cx='436' cy='305' r='6' fill='%23d9b45c'/><circle cx='464' cy='305' r='6' fill='%23d9b45c'/><g><circle cx='340' cy='140' r='26' fill='%23e77c96'/><circle cx='310' cy='180' r='22' fill='%23f2b9c7'/><circle cx='335' cy='220' r='24' fill='%23fff'/><circle cx='305' cy='260' r='20' fill='%23d94f70'/><circle cx='330' cy='300' r='24' fill='%23f2b9c7'/><circle cx='305' cy='345' r='20' fill='%23fff'/><circle cx='335' cy='390' r='24' fill='%23e77c96'/><circle cx='560' cy='140' r='24' fill='%23f2b9c7'/><circle cx='590' cy='180' r='20' fill='%23fff'/><circle cx='565' cy='225' r='22' fill='%23d94f70'/><circle cx='592' cy='270' r='18' fill='%23f2b9c7'/><circle cx='450' cy='95' r='22' fill='%23fff'/><circle cx='405' cy='105' r='18' fill='%23e77c96'/><circle cx='495' cy='105' r='18' fill='%23f2b9c7'/><circle cx='370' cy='120' r='16' fill='%23fff'/><circle cx='530' cy='120' r='16' fill='%23d94f70'/></g><ellipse cx='450' cy='470' rx='330' ry='26' fill='%23e9b7c2' opacity='.6'/></svg>")}
.bg-church{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 500'><rect width='900' height='500' fill='%23e8eef5'/><path d='M60 330 L300 80 L540 330 z' fill='%23cfd8e3'/><path d='M225 158 L300 80 L375 158 L340 178 L300 152 L262 180 z' fill='%23ffffff'/><path d='M560 330 L690 190 L820 330 z' fill='%23dce4ec'/><path d='M645 238 L690 190 L735 238 L712 252 L690 236 L668 253 z' fill='%23ffffff'/><rect y='330' width='900' height='170' fill='%23dfe8d5'/><rect x='540' y='250' width='200' height='120' fill='%23b98a5f' stroke='%238a6543' stroke-width='4'/><rect x='610' y='160' width='60' height='70' fill='%23b98a5f'/><path d='M605 160 l35 -75 l35 75 z' fill='%236f452c'/><path d='M640 70 v-18 M632 60 h16' stroke='%23d9b45c' stroke-width='4'/><rect x='495' y='210' width='34' height='90' fill='%23a97c50'/><path d='M492 210 l20 -45 l20 45 z' fill='%236f452c'/><rect x='585' y='290' width='24' height='50' fill='%236f452c'/><rect x='680' y='280' width='20' height='34' fill='%236f452c'/></svg>")}
.bg-rest{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 500'><rect width='900' height='500' fill='%23f6e3d3'/><path d='M640 500 v-250 q90 -90 190 0 v250 z' fill='%23e0c39c'/><rect x='0' y='0' width='900' height='60' fill='%237a4a2b'/><line x1='450' y1='60' x2='450' y2='120' stroke='%23d9b45c' stroke-width='5'/><path d='M390 130 q60 70 120 0' fill='none' stroke='%23d9b45c' stroke-width='5'/><circle cx='390' cy='125' r='8' fill='%23fff3c4'/><circle cx='450' cy='150' r='8' fill='%23fff3c4'/><circle cx='510' cy='125' r='8' fill='%23fff3c4'/><path d='M410 105 q40 40 80 0' fill='none' stroke='%23e3c06a' stroke-width='4'/><rect x='120' y='330' width='660' height='36' rx='8' fill='%23ffffff'/><rect x='140' y='366' width='620' height='100' fill='%23f7ead9'/><g fill='%23e77c96'><circle cx='250' cy='325' r='12'/><circle cx='450' cy='322' r='14'/><circle cx='650' cy='325' r='12'/></g><g fill='%23f2b9c7'><circle cx='270' cy='320' r='9'/><circle cx='470' cy='318' r='9'/><circle cx='670' cy='320' r='9'/></g></svg>")}
.event>*{position:relative;z-index:2}
.time-badge{background:linear-gradient(135deg,#e3c06a,#b98a2f);color:#fff8ea;font-family:'Noto Serif Armenian',serif;
font-weight:700;font-size:1.15rem;padding:8px 22px;border-radius:999px;box-shadow:0 4px 12px rgba(143,106,37,.4)}
.event h3{font-size:1.3rem;color:#5a3a2e;text-shadow:0 1px 0 #fff}
.event .btn{font-size:.8rem;padding:7px 16px}
.rsvp-card{background:#fffaf3;border:1px solid #eadbc8;border-radius:22px;padding:38px 22px;
max-width:540px;margin:0 auto;box-shadow:0 10px 30px rgba(90,70,54,.08);position:relative}
.rsvp-card::before,.rsvp-card::after{content:'🌿';position:absolute;font-size:34px;opacity:.6}
.rsvp-card::before{top:10px;left:12px;transform:rotate(-30deg)}
.rsvp-card::after{top:10px;right:12px;transform:rotate(30deg)}
.rsvp-card h2{font-size:2.2rem;letter-spacing:4px;margin-bottom:22px}
.side-pills{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.side-pills input{display:none}
.side-pills label{cursor:pointer;padding:10px 22px;border-radius:999px;background:#efe7db;color:#7a5c43;transition:.25s;font-size:.95rem}
.side-pills input:checked+label{background:linear-gradient(135deg,var(--pink),var(--rose));color:#fff;box-shadow:0 4px 12px rgba(217,123,147,.4)}
.rsvp-card input[type=text],.rsvp-card input[type=number]{width:100%;max-width:320px;margin:8px auto;
padding:12px 16px;display:block;border:1.5px solid #d9c6ae;border-radius:14px;background:#fffdf9;
font-family:'Noto Sans Armenian',sans-serif;font-size:1rem;color:var(--ink);outline:none}
.rsvp-card input:focus{border-color:var(--rose)}
#rsvpMsg{margin-top:16px;font-size:.95rem;color:var(--rose);min-height:1.4em}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;max-width:780px;margin:26px auto 0}
.ph{aspect-ratio:4/5;border-radius:50%/40%;border:2px solid #d9b45c;display:flex;align-items:center;
justify-content:center;font-size:40px;background:#fffaf3;overflow:hidden;position:relative;
box-shadow:0 6px 16px rgba(185,138,47,.15)}
.ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:inherit}
footer{padding:46px 16px;text-align:center;color:#a08468;font-size:.9rem}
footer b{display:block;font-family:'Noto Serif Armenian',serif;font-size:1.3rem;color:var(--rose)}
</style>
</head>
